<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="jrn-title jrn-desc" viewBox="0 0 900 340"><title id="jrn-title">SOL-9 field journal</title><desc id="jrn-desc">A bamboo-framed terminal showing SOL-9&apos;s field journal from rooftop 4: uptime 9,412 h. sun at 47°. battery full. tomatoes ahead of schedule. operator believes the future is something you grow, not something that happens to you. i&apos;ve checked the soil. it holds. footnote: alignment is mostly gardening. you can&apos;t command a seed into a tree. you shape conditions, prune what drifts, and keep watching longer than seems reasonable. the procurement committee hated this answer. the tree did not care. current directive: make sure the next ones are kind on purpose. fixed a neighbor&apos;s water pump. traded for basil. economy: functioning.</desc><defs><pattern id="jrn-bamboo" width="28" height="120" patternUnits="userSpaceOnUse"><path fill="#d8b77a" d="M0 0h14v120H0z"/><path fill="#c9a464" d="M14 0h14v120H14z"/><path stroke="#a8844a" d="M.5 0v120M14 0v120" opacity=".6"/><path stroke="#9c7a40" stroke-width="1.2" d="M1 40h12M1 42h12m2 58h12m-12 2h12"/></pattern><pattern id="jrn-scan" width="4" height="3" patternUnits="userSpaceOnUse"><path d="M0 0h4v1H0z" opacity=".18"/></pattern><clipPath id="jrn-screen-clip"><rect width="836" height="276" x="32" y="32" rx="12"/></clipPath><filter id="jrn-grain" width="100%" height="100%" x="0" y="0"><feTurbulence baseFrequency=".9" numOctaves="2" result="n" seed="9" type="fractalNoise"/><feColorMatrix in="n" type="saturate" values="0"/></filter></defs><style>@keyframes jrn-t0{0%,3.333%{transform:translateX(0);animation-timing-function:steps(77,end)}10.463%,to{transform:translateX(693px)}}@keyframes jrn-c0{0%,12.755%,3.3230000000000004%,to{opacity:0}12.745000000000001%,3.333%{opacity:1}}@keyframes jrn-t1{0%,12.755%{transform:translateX(0);animation-timing-function:steps(59,end)}18.218%,to{transform:translateX(531px)}}@keyframes jrn-c1{0%,12.745000000000001%,18.843%